<section id="consent-screen">
  <h1>🍪 Consenso ai cookie</h1>
  <p>Per offrirti un'esperienza migliore, utilizziamo cookie tecnici e analitici.</p>
  <button id="accept-cookies">Accetto</button>
</section>

<script type="module">
    
  document.getElementById("accept-cookies")?.addEventListener("click", async () => {
    try {
      const res = await fetch("/auth/session", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ consentGiven: true })
      });

      if (!res.ok) {
        throw new Error("Errore nella creazione della sessione");
      }

      const wrapper = document.getElementById("wrapper");
      const menu = await fetch("/static/pages/menu.html").then(r => r.text());
      wrapper.innerHTML = menu;
    } catch (err) {
      alert("Errore durante il consenso: " + err);
    }
  });
</script>
