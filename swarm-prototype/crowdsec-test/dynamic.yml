# Configurazione dinamica: un router verso il backend di prova, protetto dal
# middleware bouncer.

http:
  routers:
    whoami:
      rule: "Path(`/`)"
      entryPoints:
        - web
      middlewares:
        - crowdsec
      service: whoami

  services:
    whoami:
      loadBalancer:
        servers:
          - url: "http://whoami:80"

  middlewares:
    crowdsec:
      plugin:
        crowdsec:
          enabled: "true"
          # In modalita' "stream" il bouncer mantiene una cache locale delle
          # decisioni aggiornata periodicamente, invece di interrogare la LAPI
          # a ogni richiesta.
          crowdsecMode: stream
          crowdsecLapiHost: crowdsec:8080
          crowdsecLapiScheme: http
          crowdsecLapiKey: prova-bouncer-key
          updateIntervalSeconds: 5
          # Numero di aggiornamenti falliti oltre il quale lo stream viene
          # considerato non integro. Con il default (0) la condizione scatta al
          # primo fallimento e tutte le richieste vengono bloccate finche' la
          # LAPI non torna raggiungibile. Con -1 la condizione non scatta e il
          # bouncer continua a decidere sulla base della cache locale.
          updateMaxFailure: -1
          # Codice restituito alle richieste bloccate.
          remediationStatusCode: 403
