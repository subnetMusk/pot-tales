# Configurazione statica di Traefik.
# I plugin vanno dichiarati nella configurazione statica.

entryPoints:
  web:
    address: ":80"

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

log:
  level: INFO

# I plugin Traefik sono sorgente Go interpretato e vengono scaricati da GitHub
# all'avvio. Una versione non compatibile con il Traefik in uso produce un
# errore fatale e impedisce la partenza del proxy.
experimental:
  plugins:
    crowdsec:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.7.1
