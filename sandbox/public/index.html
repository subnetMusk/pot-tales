<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phaser Sandbox</title>
  <style>
    /* Piena area per il canvas di Phaser */
    #game-container { width: 100%; height: 100vh; overflow: hidden; }
    /* Contenitore aggiuntivo per la UI custom */
    #sandbox-ui { position: absolute; top: 10px; left: 10px; z-index: 10; }
  </style>
</head>
<body>
  <!-- Contenitore dove Phaser monterà il canvas -->
  <div id="game-container"></div>
  <!-- Contenitore per la UI di prova -->
  <div id="sandbox-ui"></div>

  <!-- Script principale del client (alias → ../client/src/main.ts) -->
  <script type="module" src="/main.ts"></script>
  <!-- Placeholder per la UI di Custom Scenes -->
  <script type="module" src="/scripts/CustomScene.ts"></script>
</body>
</html>
