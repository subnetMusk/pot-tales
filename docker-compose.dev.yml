############################
# NETWORK DEFINITIONS
############################

networks:
  # Private internal network for secure communication between backend, DB, dashboards
  internal_net:
    name: internal_net
    internal: true  # prevents containers from reaching the external internet

  # Bridge network used by Traefik to communicate with backend services
  proxy_net:
    name: proxy_net
    driver: bridge

  # Bridge network used by Traefik to communicate with front-end apps
  frontend_net:
    name: frontend_net
    driver: bridge

############################
# SERVICE DEFINITIONS
############################

services:

  # Traefik – reverse proxy con routing dichiarativo via file provider
  proxy:
    image: traefik:v3.7.10@sha256:9c3b91d5fb7770853ca5c1124a23c34bf2d9b47ffaebeab2614cbaf410dcb2ac
    container_name: traefik
    restart: unless-stopped
    command:
      - --configfile=/etc/traefik/traefik.yml
    ports:
      - "80:80"                                   # HTTP
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"    # dashboard (solo dev)
    networks:
      - proxy_net
      - frontend_net
    volumes:
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_logs:/var/log/traefik
    depends_on:
      - server
      - sandbox
      - frontend
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Go backend API service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: builder
    container_name: server
    networks:
      - internal_net
      - proxy_net
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL}
      - SESSION_TTL_MIN=${SESSION_TTL_MIN}
      - ELASTIC_APM_SERVER_URL=${ELASTIC_APM_SERVER_URL}
      - ELASTIC_APM_SERVICE_NAME=${ELASTIC_APM_SERVICE_NAME}
      - ELASTIC_APM_ENVIRONMENT=${ELASTIC_APM_ENVIRONMENT}
      - ELASTIC_APM_SECRET_TOKEN=${ELASTIC_APM_SECRET_TOKEN}
    volumes:
      - ./server:/src:delegated
      - ./comms:/src/comms:ro
    expose:
      - "3000"  # internal API port (proxied)
    command: air  # hot-reload tool
    depends_on:
      - db
      - redis
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Redis in-memory database with ACL
  redis:
    image: redis:8.10.0-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    container_name: redis
    env_file:
      - .env
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./docker/redis/users.acl:/usr/local/etc/redis/users.acl:ro
    expose:
      - "6379"
    networks:
      - internal_net
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # MongoDB database with init scripts and log bind
  db:
    image: mongo:8.2.12@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
    container_name: db
    env_file:
      - .env
    expose:
      - "27017"
    networks:
      - internal_net
    volumes:
      - ./docker/volumes/mongodb:/data/db:delegated
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
      - ./docker/volumes/logs/mongodb:/var/log/mongodb
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # MongoDB Web UI (mongo-express)
  mongo-ui:
    image: mongo-express:1.0.2@sha256:1b23d7976f0210dbec74045c209e52fbb26d29b2e873d6c6fa3d3f0ae32c2a64
    container_name: mongo-ui
    restart: unless-stopped
    environment:
      - ME_CONFIG_MONGODB_SERVER=${MONGODB_HOST}
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGODB_HOST}:27017
    networks:
      - internal_net
      - proxy_net
    depends_on:
      - db
    expose:
      - "8081"
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Web UI (redis-commander)
  redis-ui:
    # L'immagine upstream pubblica solo il tag `latest`, pinnato per digest.
    image: rediscommander/redis-commander:latest@sha256:19cd0c49f418779fa2822a0496c5e6516d0c792effc39ed20089e6268477e40a
    container_name: redis-ui
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=${REDIS_UI_HOSTS}
    networks:
      - internal_net
      - proxy_net
    depends_on:
      - redis
    expose:
      - "8081"
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Vite sandbox frontend dev server
  sandbox:
    build: ./sandbox
    container_name: sandbox
    env_file:
      - .env
    networks:
      - frontend_net
    expose:
      - "5173"
    volumes:
      - ./sandbox/package.json:/app/package.json:ro
      - ./sandbox/package-lock.json:/app/package-lock.json:ro
      - ./sandbox/vite.config.ts:/app/vite.config.ts:ro
      - ./sandbox/index.html:/app/index.html:ro
      - ./sandbox/src:/app/src:delegated
      - ./frontend/src:/frontend/src:ro
      - ./frontend/public/assets:/app/public/assets:ro
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - server
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Production frontend build (served statically by NGINX)
  frontend:
    build: ./frontend
    container_name: frontend
    env_file:
      - .env
    networks:
      - frontend_net
    environment:
      - REDIS_FE_URL=${REDIS_FE_URL}
      - VITE_ELASTIC_APM_RUM_ACTIVE=${ELASTIC_APM_RUM_ACTIVE:-false}
      - VITE_ELASTIC_APM_RUM_SERVER_URL=${ELASTIC_APM_RUM_SERVER_URL}
      - VITE_ELASTIC_APM_RUM_SERVICE_NAME=${ELASTIC_APM_RUM_SERVICE_NAME}
      - VITE_ELASTIC_APM_ENVIRONMENT=${ELASTIC_APM_ENVIRONMENT}
    expose:
      - "80"
    depends_on:
      - server
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


############################
# VOLUME DEFINITIONS
############################
volumes:
  esdata: {}              # Persistent data for Elasticsearch
  traefik_logs: {}        # Access log, sorgente per l'analisi di sicurezza
