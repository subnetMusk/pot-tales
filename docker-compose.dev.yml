version: "3.9"

services:
  proxy:
    image: nginx:alpine
    container_name: proxy
    ports:
      - "80:80"
    env_file:
      - docker/env/.env
    volumes:
      - ${NGINX_CONFIG}:/etc/nginx/nginx.conf:ro
      - ./proxy/certs:/etc/nginx/certs:ro
      - ./proxy/proxy_params:/etc/nginx/proxy_params:ro

      - ./docker/volumes/proxy-logs:/var/log/nginx:delegated

      - ./client/dist:/var/www/client:ro
      - ./sandbox/dist:/var/www/sandbox:ro
    depends_on:
      - server
      - sandbox
      - client

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: server
    env_file:
      - docker/env/.env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGO_URI=${MONGO_URI}
    volumes:
      - ./server/public:/app/public:ro
      - ./server:/app:delegated
    expose:
      - "3000"
    depends_on:
      - db

  sandbox:
    build: ./sandbox
    container_name: sandbox
    env_file:
      - docker/env/.env
    expose:
      - "5173"
    volumes:
      - ./sandbox/public:/app/public:delegated
      - ./sandbox/package.json:/app/package.json:ro
      - ./sandbox/package-lock.json:/app/package-lock.json:ro
      - ./sandbox/vite.config.ts:/app/vite.config.ts:ro
      - ./client/src:/app/src:delegated
    command: npm run dev
    depends_on:
      - server

  client:
    build: ./client
    container_name: client
    expose:
      - "80"
    depends_on:
      - server

  db:
    image: mongo:latest
    container_name: db
    expose:
      - "27017"
    volumes:
      - ./docker/volumes/mongodb:/data/db:delegated
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
