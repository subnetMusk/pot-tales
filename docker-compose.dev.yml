############################
# VERSION
############################
version: '3.8'

############################
# VOLUMES DEFINITIONS
############################
volumes:
  certs:
    driver: local
  esdata01: 
    driver: local
  kibanadata:
    driver: local
  # mongoDB data persistence  
  # mongodb:
  #   driver: local

  # Uncomment if using Fleet Server for more advanced Elastic Agent management
  # fleetserverdata:
  #   driver: local

  npm_data: {}            # Proxy Manager SQLite config
  npm_letsencrypt: {}     # SSL certs for domains

############################
# NETWORK DEFINITIONS
############################

networks:
  # Private internal network for secure communication between backend, DB, dashboards
  internal_net:
    name: internal_net
    internal: true  # prevents containers from reaching the external internet

  # Bridge network used by NGINX Proxy Manager to communicate with backend services
  proxy_net:
    name: proxy_net
    driver: bridge

  # Bridge network used by NGINX Proxy Manager to communicate with front-end apps
  frontend_net:
    name: frontend_net
    driver: bridge

  # Dedicated bridge network to allow Kibana to reach the public internet (e.g. Elastic Package Registry)
  kibana_net:
    name: kibana_net
    driver: bridge

############################
# SERVICE DEFINITIONS
############################

services:

  # NGINX Proxy Manager – manages virtual hosts and TLS termination
  proxy:
    image: jc21/nginx-proxy-manager:2
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"        # HTTP
      - "443:443"      # HTTPS
      - "${PROXY_ADMIN_PORT}:81"     # Admin UI
    networks:
      - proxy_net
      - frontend_net
    environment:
      - DB_SQLITE_FILE=${DB_SQLITE_FILE}  # path within container to SQLite DB file for NPM for storing config of virtual hosts, users, etc.
    volumes:
      # Redundant with volumes section 
      # - ./docker/volumes/npm_data:/data                       # persistent UI and config data
      # - ./docker/volumes/npm_letsencrypt:/etc/letsencrypt     # persistent SSL certificates
      - npm_data:/data                                        # persistent UI and config data
      - npm_letsencrypt:/etc/letsencrypt                       # persistent SSL certificates
      - ./frontend/dist:/var/www/frontend:ro                  # frontend build assets mounted read-only in the container
      - ./sandbox/dist:/var/www/sandbox:ro                    # sandbox build assets mounted read-only in the container
    depends_on:
      - server
      - sandbox
      - frontend

  # Go backend API service
  server:
    build:
      context: ./server           # build from server/ directory
      dockerfile: Dockerfile      # use multi-stage Dockerfile
      target: builder             # build the 'builder' stage, which includes dev tools
    container_name: server    
    networks:
      - internal_net              # secure backend DB access
      - proxy_net                 # allow NPM to proxy requests, in order to expose API to internet only through the proxy    
    env_file:
      - .env           # load environment variables from file 
    environment:
      - REDIS_URL=${REDIS_URL}
      - SESSION_TTL_MIN=${SESSION_TTL_MIN}
      - ELASTIC_APM_SERVER_URL=${ELASTIC_APM_SERVER_URL}
      - ELASTIC_APM_SERVICE_NAME=${ELASTIC_APM_SERVICE_NAME}
      - ELASTIC_APM_ENVIRONMENT=${ELASTIC_APM_ENVIRONMENT}
      - ELASTIC_APM_SECRET_TOKEN=${ELASTIC_APM_SECRET_TOKEN}
    volumes:
      - ./server:/src:delegated   # source code mounted with delegated option for better performance during development
                                  # and also to allow hot-reloading with air, so when files change in host, they are updated in container
      - ./comms:/src/comms:ro     # common types mounted read-only
    expose:
      - "3000"                    # internal API port (proxied)
    command: air                  # hot-reload tool
    depends_on:
      - db
      - redis

  # Redis in-memory database with ACL
  redis:
    image: redis:alpine                                                   # lightweight Alpine-based Redis image  
    container_name: redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]          # start Redis with custom config file (enables ACL) 
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro      # custom Redis config file mounted read-only
      - ./docker/redis/users.acl:/usr/local/etc/redis/users.acl:ro        # custom Redis ACL file mounted read-only
    expose:
      - "6379"
    networks:
      - internal_net            # only accessible by backend and other internal services

  # MongoDB database with init scripts and log bind
  db:
    image: mongo:latest
    container_name: db
    expose:
      - "27017"
    networks:
      - internal_net
    volumes:
    # - mongodb:/data/db                                        # named volume for MongoDB data persistence
      - ./docker/volumes/mongodb:/data/db:delegated             # bind mount for easier access to DB files (e.g. for debugging)
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro         # initialization scripts, mounted read-only (atm empty)
      - ./docker/volumes/logs/mongodb:/var/log/mongodb          # MongoDB logs can be destined in a specific host directory for easier access

  # MongoDB Web UI (mongo-express)
  mongo-ui:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped                                     # assure it restarts if the container crashes
    environment:
      - ME_CONFIG_MONGODB_SERVER=${MONGODB_HOST}                # MongoDB host (service name)
    networks:
      - internal_net                                            # so it can reach the DB
      - proxy_net                                               # so NPM can proxy requests to it
    depends_on:
      - db                                                      # wait for DB to be ready before starting the UI
    expose:
      - "8081"                                                  # internal port, only accessible through NPM proxy

  # Redis Web UI (redis-commander)
  redis-ui:
    image: rediscommander/redis-commander:latest
    platform: linux/amd64                                       # force amd64 platform on Apple Silicon (M1/M2) Macs
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=${REDIS_UI_HOSTS}                           # comma-separated list of Redis hosts in the format name:host:port:db:username:password
    networks:
      - internal_net
      - proxy_net
    depends_on:
      - redis
    expose:
      - "8081"

  # Vite sandbox frontend dev server
  sandbox:
    build: ./sandbox
    container_name: sandbox
    networks:
      - frontend_net                                              # exposed to the frontend network so NPM can proxy requests to it
    env_file:
      - .env                                                      # load environment variables from file -> docker/env/.env is duplicate of .env in the root
    # Uncomment to override defaults for development and having hot-reloading
    # environment:
    #   - CHOKIDAR_USEPOLLING=true                                # for file change detection on some systems (e.g. Docker Desktop on Mac/Windows) without reloading the whole container
    #   - VITE_HOST=0.0.0.0                                       # to allow access from outside the container 
    expose:
      - "5173"                                                    # Vite dev server port (exposed internally, proxied by NPM)
    volumes:
      # Uncomment for having a full 
      # - ./sandbox:/app:delegated                                   # source code mounted with delegated option for better performance during development
      # - /app/node_modules                                         # to prevent overwriting node_modules in the container
      - ./sandbox/package.json:/app/package.json:ro               # package.json mounted read-only     
      - ./sandbox/package-lock.json:/app/package-lock.json:ro     # package-lock.json mounted read-only
      - ./sandbox/vite.config.ts:/app/vite.config.ts:ro           # Vite config mounted read-only   
    command: npm run dev
    depends_on:
      - server

  # Production frontend build (served statically by NGINX)
  frontend:
    build: ./frontend
    container_name: frontend
    args:
      VITE_ELASTIC_APM_RUM_SERVER_URL: ${ELASTIC_APM_RUM_SERVER_URL}
      VITE_ELASTIC_APM_RUM_SERVICE_NAME: ${ELASTIC_APM_RUM_SERVICE_NAME}
      VITE_ELASTIC_APM_RUM_SECRET_TOKEN: ${ELASTIC_APM_RUM_SECRET_TOKEN}
      VITE_ELASTIC_APM_ENVIRONMENT: ${ELASTIC_APM_ENVIRONMENT}
    networks:
      - frontend_net
    env_file:
      - .env                                                        # load environment variables from file -> docker/env/.env is duplicate of .env in the root    
    environment:
      # Removing REDIS_FE_URL as it's not used in the frontend, but in the backend. 
      # This env variable will (probably) never be used in the frontend code.
      # - REDIS_FE_URL=${REDIS_FE_URL}
    expose:
      - "80"
    depends_on:
      - server
    volumes:
      - ./comms:/app/comms:ro

  # Elasticsearch (log + APM data storage)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.authc.api_key.enabled=true
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - ES_JAVA_OPTS=${ELASTICSEARCH_JAVA_OPTS}
    expose:
      - "9200"
    networks:
      - internal_net
      - proxy_net
    volumes:
      - ./docker/volumes/logs/esdata:/usr/share/elasticsearch/data

  # Kibana UI for logs, APM, metrics, and dashboards
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=${ELASTICSEARCH_HOSTS}
      - XPACK_APM_SERVICEURL=${APM_SERVER_URL}
    volumes:
      - ./docker/volumes/kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
      - ./docker/volumes/kibana/data:/usr/share/kibana/data
    depends_on:
      - elasticsearch
    expose:
      - "5601"
    networks:
      - internal_net
      - proxy_net
      - kibana_net  # gives Kibana internet access for integrations

  # Elastic APM Server – collects trace, error and performance data
  apm-server:
    image: docker.elastic.co/apm/apm-server:8.13.4
    container_name: apm-server
    command: >
      apm-server -e
        -E apm-server.rum.enabled=true
        -E apm-server.kibana.enabled=true
        -E apm-server.kibana.host="${KIBANA_HOST}"
        -E apm-server.auth.secret_token="${APM_SECRET_TOKEN}"
        -E output.elasticsearch.hosts=["${ELASTICSEARCH_HOST}"]
        -E output.elasticsearch.username="${ELASTICSEARCH_USERNAME}"
        -E output.elasticsearch.password="${ELASTICSEARCH_PASSWORD}"
    networks:
      - internal_net
      - proxy_net
    expose:
      - "8200"  # APM server port
    depends_on:
      - elasticsearch
      - kibana

  # Fluent Bit – collect logs from Docker containers and forward to Elasticsearch
  fluent-bit:
    image: fluent/fluent-bit:2.2
    container_name: fluent-bit
    environment:
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
    volumes:
      - ./docker/volumes/fluent-bit:/fluent-bit/etc:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - ./docker/volumes/npm_data/logs:/fluent-bit/npm_logs:ro
      - ./docker/volumes/fluent-bit-db:/fluent-bit/db
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - elasticsearch
    networks:
      - internal_net

  ############################
  # ELASTIC AGENT
  ############################
  elastic-agent:
    image: docker.elastic.co/beats/elastic-agent:8.13.4
    container_name: elastic-agent
    restart: unless-stopped
    user: root
    environment:
      - ELASTIC_AGENT_STANDALONE=${ELASTIC_AGENT_STANDALONE}
      - ELASTICSEARCH_HOSTS=${ELASTICSEARCH_HOSTS}
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
    volumes:
      - ./docker/volumes/elastic-agent/elastic-agent.yml:/usr/share/elastic-agent/elastic-agent.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /proc:/hostfs/proc:ro
      - /:/hostfs:ro
    depends_on:
      - elasticsearch
      - kibana
    networks:
      - internal_net