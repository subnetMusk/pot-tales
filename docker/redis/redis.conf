###############################################################################
# redis.conf — Custom Redis configuration for development with ACL and LFU
# Purpose   : Fast in-memory store (no persistence), session/token cache
###############################################################################

##############################################
# SECURITY: User permissions via ACL
##############################################

# Use an external ACL file to define users and permissions
aclfile /usr/local/etc/redis/users.acl

# No global password required (can be left empty when using ACL)
requirepass ""

# Enable protection against external access (on by default)
protected-mode no

##############################################
# PERSISTENCE: Disabled for in-memory use only
##############################################

# Do not use AOF (Append Only File)
appendonly no

# Disable RDB snapshotting completely
save ""

##############################################
# MEMORY MANAGEMENT
##############################################

# Limit Redis to 256 MB RAM
maxmemory 256mb

# Use Least Frequently Used eviction strategy
maxmemory-policy allkeys-lfu

# Free evicted keys in background
lazyfree-lazy-eviction yes

# Expire keys in background
lazyfree-lazy-expire yes

# Delete commands free memory lazily
lazyfree-lazy-server-del yes

##############################################
# LOGGING & MONITORING
##############################################

# Set log verbosity level (debug, verbose, notice, warning)
loglevel notice

# Log to stdout (empty disables log file)
logfile ""

##############################################
# PERFORMANCE TUNING
##############################################

# Default tick rate for internal tasks (e.g., key expiration)
hz 10

##############################################
# NETWORK (keep defaults for containerized use)
##############################################

# bind 127.0.0.1 ::1   # Uncomment only if exposing manually
# port 6379            # Default port