# ------------------------------------------------------------
# localhost
# ------------------------------------------------------------



map $scheme $hsts_header {
    https   "max-age=63072000; preload";
}

server {
  set $forward_scheme http;
  set $server         "server";
  set $port           3000;

  listen 80;
listen [::]:80;


  server_name localhost;
http2 off;











proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $http_connection;
proxy_http_version 1.1;


  access_log /data/logs/proxy-host-4_access.log proxy;
  error_log /data/logs/proxy-host-4_error.log warn;

location /sandbox-assets/ {
    alias /var/www/sandbox/assets/;
    access_log off;
    types {
        application/javascript js;
        text/css css;
    }
    default_type application/javascript;
    try_files $uri =404;
}

location /frontend-assets/ {
    alias /var/www/frontend/assets/;
    access_log off;
    types {
        application/javascript js;
        text/css css;
        image/png png;
        image/jpeg jpeg;
    }
    try_files $uri =404;
}

# Rewrite per path Phaser Editor: frontend/public/assets -> /assets
location ~ ^/frontend/public/assets/(.*)$ {
    rewrite ^/frontend/public/assets/(.*)$ /assets/$1 last;
}

location /assets/ {
    alias /var/www/frontend/assets/;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    types {
        application/javascript js;
        text/css css;
        image/png png;
        image/jpeg jpeg;
        image/gif gif;
        image/webp webp;
        application/json json;
        font/ttf ttf;
        font/woff woff;
        font/woff2 woff2;
    }
    try_files $uri =404;
}

location /sandbox/frontend-assets/ {
    alias /var/www/frontend/assets/;
    access_log off;
    types {
        application/javascript js;
        text/css css;
        image/png png;
        image/jpeg jpeg;
    }
    try_files $uri =404;
}

location /sandbox/ {
    root /var/www;
    index index.html;
    try_files $uri /sandbox/index.html;
}

location /static/ {
    root /var/www/frontend;
}

location /static/pages/ {
    root /var/www/frontend;
}

location / {
    root /var/www/frontend;
    index index.html;
    try_files $uri /index.html;
}


  location /health {
    

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Scheme $scheme;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-For    $remote_addr;
    proxy_set_header X-Real-IP		$remote_addr;

    proxy_pass       http://server:3000;

    

    
    
    
    


    
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    
  }

  location /api/ {
    

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Scheme $scheme;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-For    $remote_addr;
    proxy_set_header X-Real-IP		$remote_addr;

    proxy_pass       http://server:3000;

    

    
    
    
    


    
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    
  }

  location /auth/ {
    

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Scheme $scheme;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-For    $remote_addr;
    proxy_set_header X-Real-IP		$remote_addr;

    proxy_pass       http://server:3000;

    

    
    
    
    


    
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    
  }





  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}
