# ------------------------------------------------------------
# 195.201.194.231, localhost
# ------------------------------------------------------------



map $scheme $hsts_header {
    https   "max-age=63072000; preload";
}

server {
  set $forward_scheme http;
  set $server         "server";
  set $port           3000;

  listen 80;
listen [::]:80;


  server_name 195.201.194.231 localhost;
http2 off;











proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $http_connection;
proxy_http_version 1.1;


  access_log /data/logs/proxy-host-4_access.log proxy;
  error_log /data/logs/proxy-host-4_error.log warn;

root /var/www/frontend;

# 1. REWRITE TUTTO QUELLO CHE INIZIA CON /frontend/public/assets/ O /frontend-assets/
if ($request_uri ~ "^/(frontend/public/assets|frontend-assets)/(.*)") {
    rewrite ^/(frontend/public/assets|frontend-assets)/(.*)$ /assets/$2 last;
}

# 2. PER IMMAGINI SENZA ESTENSIONE IN /assets/images/
if ($request_uri ~ "^/assets/images/(.+)/([^/.]+)$") {
    rewrite ^/assets/images/(.+)/([^/.]+)$ /assets/images/$1/$2.png last;
}

# 3. LOCATION SEMPLICE PER TUTTO
location / {
    # Prova in questo ordine:
    # 1. File esatto
    # 2. File con .png
    # 3. File con .jpg/.jpeg
    # 4. Directory
    # 5. index.html (SPA)
    try_files $uri $uri.png $uri.jpg $uri.jpeg $uri/ /index.html;
    
    # CORS
    add_header Access-Control-Allow-Origin "*";
}

  location /api/ {
    

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Scheme $scheme;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-For    $remote_addr;
    proxy_set_header X-Real-IP		$remote_addr;

    proxy_pass       http://server:3000;

    

    
    
    
    


    
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    
  }

  location /health {
    

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Scheme $scheme;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-For    $remote_addr;
    proxy_set_header X-Real-IP		$remote_addr;

    proxy_pass       http://server:3000;

    

    
    
    
    


    
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    
  }

  location /auth/ {
    

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Scheme $scheme;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-For    $remote_addr;
    proxy_set_header X-Real-IP		$remote_addr;

    proxy_pass       http://server:3000;

    

    
    
    
    


    
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    
  }





  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}

