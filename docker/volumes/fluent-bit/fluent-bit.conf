############################################################
# Fluent Bit configuration file
# Purpose: Collect logs from Docker, NGINX Proxy Manager, MongoDB
#          with optimized filtering and container tagging
############################################################

[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

############################################################
# INPUT: Docker containers (stdout/stderr) with metadata
############################################################
[INPUT]
    Name          tail
    Path          /var/lib/docker/containers/*/*.log
    Parser        docker
    Tag           docker.*
    Refresh_Interval 5
    Rotate_Wait   30
    Mem_Buf_Limit 15MB
    Skip_Long_Lines On
    DB            /fluent-bit/db/flb_container_logs.db
    Docker_Mode   On
    Docker_Mode_Flush 5

############################################################
# INPUT: NGINX Proxy Manager Access Logs (enhanced)
############################################################
[INPUT]
    Name          tail
    Path          /fluent-bit/npm_logs/*_access.log
    Tag           proxy.access
    Parser        nginx_proxy_access
    DB            /fluent-bit/db/flb_proxy_access.db
    Mem_Buf_Limit 5MB
    Refresh_Interval 5
    Rotate_Wait   30

############################################################
# INPUT: NGINX Proxy Manager Error Logs (enhanced)
############################################################
[INPUT]
    Name          tail
    Path          /fluent-bit/npm_logs/*_error.log
    Tag           proxy.error
    Parser        nginx_error
    DB            /fluent-bit/db/flb_proxy_error.db
    Mem_Buf_Limit 5MB
    Refresh_Interval 5
    Rotate_Wait   30

############################################################
# INPUT: MongoDB log (via bind mount)
############################################################
[INPUT]
    Name    tail
    Path    /var/log/mongodb/mongod.log
    Tag     db.mongo
    Parser  mongodb
    DB      /fluent-bit/db/flb_mongodb.db

############################################################
# FILTER: Extract container info and add metadata
############################################################
[FILTER]
    Name          modify
    Match         docker.*
    Add           source fluent-bit
    Add           log_type docker

# Extract container ID and name from log file path
[FILTER]
    Name          lua
    Match         docker.*
    Script        /fluent-bit/etc/container_name.lua
    Call          extract_container_info

############################################################
# FILTER: Elasticsearch log noise reduction (enhanced)
############################################################
# Filter out time series index updates (very noisy)
[FILTER]
    Name          grep
    Match         docker.*
    Exclude       log .*updating \[index\.time_series\.end_time\].*

# Filter out cluster update tasks
[FILTER]
    Name          grep
    Match         docker.*
    Exclude       log .*cluster\[updateTask\].*

# Filter out system metrics indices (not relevant for game monitoring)
[FILTER]
    Name          grep
    Match         docker.*
    Exclude       log .*metrics-system\.(process|uptime|diskio|filesystem|fsstat|process\.summary).*

# Filter out cluster service tasks
[FILTER]
    Name          grep
    Match         docker.*
    Exclude       log .*clusterApplierService.*

# Filter out index template operations (maintenance noise)
[FILTER]
    Name          grep
    Match         docker.*
    Exclude       log .*updating index template.*

# Filter out shard allocation info logs
[FILTER]
    Name          grep
    Match         docker.*
    Exclude       log .*current_state_version.*

# Filter out datastream rollover info (unless error)
[FILTER]
    Name          grep
    Match         docker.*
    Exclude       log .*rollover\s+\[.+\]\s+\[condition.*

# Keep important Elasticsearch logs (errors, warnings, security)
[FILTER]
    Name          grep
    Match         docker.*
    Regex         log .*(ERROR|WARN|security|authentication|authorization|failed|exception).*

############################################################
# FILTER: NGINX Proxy Manager log enrichment (enhanced)
############################################################
[FILTER]
    Name          modify
    Match         proxy.*
    Add           service_type nginx_proxy_manager
    Add           component reverse_proxy

# Extract proxy host from filename and classify log type
[FILTER]
    Name          lua
    Match         proxy.*
    Script        /fluent-bit/etc/proxy_enrichment.lua
    Call          extract_proxy_host

# Add event classification for proxy logs
[FILTER]
    Name          modify
    Match         proxy.access
    Add           event_type access_log
    Add           log_category http_request

[FILTER]
    Name          modify
    Match         proxy.error
    Add           event_type error_log
    Add           log_category error_tracking

# Classify access events by HTTP status
[FILTER]
    Name          lua
    Match         proxy.access
    Script        /fluent-bit/etc/proxy_enrichment.lua
    Call          classify_http_status

# Extract domain information from Host header (if available)
[FILTER]
    Name          lua
    Match         proxy.access
    Script        /fluent-bit/etc/proxy_enrichment.lua
    Call          extract_domain_info

############################################################
# FILTER: Structured log routing by service and severity
############################################################
[FILTER]
    Name          rewrite_tag
    Match         docker.*
    Rule          container_name  server              logs.server.general     false

[FILTER]
    Name          rewrite_tag
    Match         docker.*
    Rule          container_name  frontend            logs.frontend.general   false

[FILTER]
    Name          rewrite_tag
    Match         docker.*
    Rule          container_name  sandbox             logs.sandbox.general    false

[FILTER]
    Name          rewrite_tag
    Match         docker.*
    Rule          container_name  elasticsearch       logs.elasticsearch.filtered false

[FILTER]
    Name          rewrite_tag
    Match         docker.*
    Rule          container_name  kibana              logs.kibana.general     false

[FILTER]
    Name          rewrite_tag
    Match         docker.*
    Rule          container_name  redis               logs.redis.general      false

[FILTER]
    Name          rewrite_tag
    Match         docker.*
    Rule          container_name  db                  logs.mongodb.docker     false

[FILTER]
    Name          rewrite_tag
    Match         docker.*
    Rule          container_name  apm-server          logs.apm.general        false

# Security and error pattern routing
[FILTER]
    Name          rewrite_tag
    Match         docker.*
    Rule          log  .*\[ATTACK\].*                 logs.security.attack    true

[FILTER]
    Name          rewrite_tag
    Match         docker.*
    Rule          log  .*\[ERROR\].*                  logs.error.general      true

[FILTER]
    Name          rewrite_tag
    Match         docker.*
    Rule          log  .*\[WARN\].*                   logs.warning.general    true

