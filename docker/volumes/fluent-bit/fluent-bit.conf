############################################################
# Fluent Bit configuration file
# Purpose: Collect logs from Docker, NGINX Proxy Manager, MongoDB
#          with optimized filtering and container tagging
############################################################

[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

############################################################
# INPUT: Docker containers (stdout/stderr) with metadata
############################################################
[INPUT]
    Name          tail
    Path          /var/lib/docker/containers/*/*.log
    Parser        docker
    Tag           docker.*
    Refresh_Interval 5
    Rotate_Wait   30
    Mem_Buf_Limit 15MB
    Skip_Long_Lines On
    DB            /fluent-bit/db/flb_container_logs.db
    Docker_Mode   On
    Docker_Mode_Flush 5

############################################################
# INPUT: NGINX Proxy Manager Access Logs (enhanced)
############################################################
[INPUT]
    Name            tail
    Path            /npm_data/logs/*_access.log
    Tag             proxy.access
    Parser          nginx_proxy_access
    DB              /fluent-bit/db/flb_proxy_access.db
    Read_From_Head  Off
    Refresh_Interval 5
    Rotate_Wait     30

############################################################
# INPUT: NGINX Proxy Manager Error Logs (enhanced)
############################################################
[INPUT]
    Name            tail
    Path            /npm_data/logs/*_error.log
    Tag             proxy.error
    Parser          nginx_error
    DB              /fluent-bit/db/flb_proxy_error.db
    Read_From_Head  Off
    Refresh_Interval 5
    Rotate_Wait     30

############################################################
# INPUT: MongoDB log (via bind mount)
############################################################
[INPUT]
    Name    tail
    Path    /var/log/mongodb/mongod.log
    Tag     db.mongo
    Parser  mongodb
    DB      /fluent-bit/db/flb_mongodb.db

############################################################
# FILTER: Extract container info and add metadata
############################################################
[FILTER]
    Name          modify
    Match         docker.*
    Add           source fluent-bit
    Add           log_type docker

# Extract container ID and name from log file path
[FILTER]
    Name          lua
    Match         docker.*
    Script        /fluent-bit/etc/container_name.lua
    Call          extract_container_info

############################################################
# FILTER: NGINX Proxy Manager log enrichment (enhanced)
############################################################
[FILTER]
    Name          modify
    Match         proxy.*
    Add           service_type nginx_proxy_manager
    Add           component reverse_proxy

# Extract proxy host from filename and classify log type
[FILTER]
    Name          lua
    Match         proxy.*
    Script        /fluent-bit/etc/proxy_enrichment.lua
    Call          extract_proxy_host

# Add event classification for proxy logs
[FILTER]
    Name          modify
    Match         proxy.access
    Add           event_type access_log
    Add           log_category http_request

[FILTER]
    Name          modify
    Match         proxy.error
    Add           event_type error_log
    Add           log_category error_tracking

# Classify access events by HTTP status
[FILTER]
    Name          lua
    Match         proxy.access
    Script        /fluent-bit/etc/proxy_enrichment.lua
    Call          classify_http_status

# Extract domain information from Host header (if available)
[FILTER]
    Name          lua
    Match         proxy.access
    Script        /fluent-bit/etc/proxy_enrichment.lua
    Call          extract_domain_info

############################################################
# FILTER: Structured log routing by service and severity
############################################################
[FILTER]
    Name  rewrite_tag
    Match docker.*
    Rule  service_name  server        logs.server.raw        false

[FILTER]
    Name  rewrite_tag
    Match docker.*
    Rule  service_name  frontend      logs.frontend.raw      false

[FILTER]
    Name  rewrite_tag
    Match docker.*
    Rule  service_name  sandbox       logs.sandbox.raw       false

[FILTER]
    Name  rewrite_tag
    Match docker.*
    Rule  service_name  es01          logs.elasticsearch.raw false

[FILTER]
    Name  rewrite_tag
    Match docker.*
    Rule  service_name  kibana        logs.kibana.raw        false

[FILTER]
    Name  rewrite_tag
    Match docker.*
    Rule  service_name  redis         logs.redis.raw         false

[FILTER]
    Name  rewrite_tag
    Match docker.*
    Rule  service_name  mongodb       logs.mongodb.raw       false

[FILTER]
    Name  rewrite_tag
    Match docker.*
    Rule  service_name  apm-agent     logs.apm.raw           false

# opzionali, se li vuoi già separati
[FILTER]
    Name  rewrite_tag
    Match docker.*
    Rule  service_name  infra-agent   logs.infra.raw         false

[FILTER]
    Name  rewrite_tag
    Match docker.*
    Rule  service_name  fleet-server  logs.fleet.raw         false

# Security and error pattern routing
[FILTER]
    Name          rewrite_tag
    Match         docker.*
    Rule          log  .*\[ATTACK\].*                 logs.security.attack    true

[FILTER]
    Name          rewrite_tag
    Match         docker.*
    Rule          log  .*\[ERROR\].*                  logs.error.general      true

[FILTER]
    Name          rewrite_tag
    Match         docker.*
    Rule          log  .*\[WARN\].*                   logs.warning.general    true

############################################################
# FILTER: Elasticsearch log noise reduction (enhanced)
############################################################
# Filtra rumore tipico ES (time series index updates)
[FILTER]
    Name    grep
    Match   logs.elasticsearch.raw
    Exclude log .*updating \[index\.time_series\.end_time\].*

# Cluster update tasks
[FILTER]
    Name    grep
    Match   logs.elasticsearch.raw
    Exclude log .*cluster\[updateTask\].*

# Metriche interne molto verbose
[FILTER]
    Name    grep
    Match   logs.elasticsearch.raw
    Exclude log .*metrics-system\.(process|uptime|diskio|filesystem|fsstat|process\.summary).*

# Log di servizio del cluster
[FILTER]
    Name    grep
    Match   logs.elasticsearch.raw
    Exclude log .*clusterApplierService.*

# Operazioni su template indice
[FILTER]
    Name    grep
    Match   logs.elasticsearch.raw
    Exclude log .*updating index template.*

# Info su shard allocation
[FILTER]
    Name    grep
    Match   logs.elasticsearch.raw
    Exclude log .*current_state_version.*

# Rollover datastream (info)
[FILTER]
    Name    grep
    Match   logs.elasticsearch.raw
    Exclude log .*rollover\s+\[.+\]\s+\[condition.*

# Mantieni solo cose importanti (errori, warning, security)
[FILTER]
    Name    grep
    Match   logs.elasticsearch.raw
    Regex   log .*(ERROR|WARN|security|authentication|authorization|failed|exception).*

############################################################
# OUTPUT: Service-specific indices with optimized routing
############################################################
# Server
[OUTPUT]
