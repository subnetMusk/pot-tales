############################################################
# Fluent Bit configuration file
# Purpose: Collect logs from Docker, Proxy, MongoDB, Redis
#          with container-based and log-type tagging
############################################################

[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

############################################################
# INPUT: Docker containers (stdout/stderr)
############################################################
[INPUT]
    Name          tail
    Path          /var/lib/docker/containers/*/*.log
    Parser        docker
    Tag           docker.*
    Refresh_Interval 5
    Rotate_Wait   30
    Mem_Buf_Limit 10MB
    Skip_Long_Lines On
    DB            /fluent-bit/db/flb_container_logs.db

############################################################
# INPUT: Nginx Proxy error log (bind → npm_data/logs)
############################################################
[INPUT]
    Name    tail
    Path    /fluent-bit/npm_logs/*_error.log
    Tag     proxy.error
    Parser  nginx_proxy_error
    DB      /fluent-bit/db/flb_proxy_error.db

############################################################
# INPUT: MongoDB log (via bind)
############################################################
[INPUT]
    Name    tail
    Path    /var/log/mongodb/mongod.log
    Tag     db.mongo
    Parser  mongodb
    DB      /fluent-bit/db/flb_mongodb.db

############################################################
# FILTER: Merge multiline Docker logs
############################################################
[FILTER]
    Name          modify
    Match         docker.*
    Add           container_tag true
    Add           service ${HOSTNAME}

############################################################
# FILTER: Structured tag re-routing by container and log type
############################################################
[FILTER]
    Name          rewrite_tag
    Match         docker.*
    Rule          log  \[.*\]\[server\]\[attack\]             logs.server.attack  true

[FILTER]
    Name          rewrite_tag
    Match         docker.*
    Rule          log  \[.*\]\[server\]\[invalid_schema\]     logs.server.invalid_schema  true

[FILTER]
    Name          rewrite_tag
    Match         docker.*
    Rule          log  \[.*\]\[frontend\]\[attack\]           logs.frontend.attack  true

[FILTER]
    Name          rewrite_tag
    Match         docker.*
    Rule          log  \[.*\]\[frontend\]\[invalid_schema\]   logs.frontend.invalid_schema  true

[FILTER]
    Name          rewrite_tag
    Match         docker.*
    Rule          log  \[.*\]\[mongo\]\[error\]               logs.mongo.error  true

[FILTER]
    Name          rewrite_tag
    Match         docker.*
    Rule          log  \[.*\]\[redis\]\[error\]               logs.redis.error  true

[FILTER]
    Name          rewrite_tag
    Match         docker.*
    Rule          log  \[.*\]\[proxy\]\[attack\]              logs.proxy.attack  true

[FILTER]
    Name          rewrite_tag
    Match         docker.*
    Rule          log  \[.*\]\[proxy\]\[error\]               logs.proxy.error  true

[FILTER]
    Name          rewrite_tag
    Match         docker.*
    Rule          log  \[.*\]\[sandbox\]\[error\]             logs.sandbox.error  true

############################################################
# OUTPUT: Attack logs
############################################################
[OUTPUT]
    Name          es
    Match         logs.*.attack
    Host          elasticsearch
    Port          9200
    HTTP_User     elastic
    HTTP_Passwd   m6OHmMuiqNrV1i25Jz3Z
    Index         logs_attack
    Type          _doc
    Logstash_Format On

############################################################
# OUTPUT: Invalid schema logs
############################################################
[OUTPUT]
    Name          es
    Match         logs.*.invalid_schema
    Host          elasticsearch
    Port          9200
    HTTP_User     elastic
    HTTP_Passwd   m6OHmMuiqNrV1i25Jz3Z
    Index         logs_invalid_schema
    Type          _doc
    Logstash_Format On

############################################################
# OUTPUT: Error logs
############################################################
[OUTPUT]
    Name          es
    Match         logs.*.error
    Host          elasticsearch
    Port          9200
    HTTP_User     elastic
    HTTP_Passwd   m6OHmMuiqNrV1i25Jz3Z
    Index         logs_error
    Type          _doc
    Logstash_Format On

############################################################
# OUTPUT: Proxy and DB logs (non-tagged input direct)
############################################################
[OUTPUT]
    Name          es
    Match         proxy.error
    Host          elasticsearch
    Port          9200
    HTTP_User     elastic
    HTTP_Passwd   m6OHmMuiqNrV1i25Jz3Z
    Index         proxy_logs
    Type          _doc
    Logstash_Format On

[OUTPUT]
    Name          es
    Match         db.mongo
    Host          elasticsearch
    Port          9200
    HTTP_User     elastic
    HTTP_Passwd   m6OHmMuiqNrV1i25Jz3Z
    Index         mongo_logs
    Type          _doc
    Logstash_Format On

[OUTPUT]
    Name          es
    Match         db.redis
    Host          elasticsearch
    Port          9200
    HTTP_User     elastic
    HTTP_Passwd   m6OHmMuiqNrV1i25Jz3Z
    Index         redis_logs
    Type          _doc
    Logstash_Format On
