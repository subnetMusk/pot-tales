# Profili di rimediazione.
#
# Gli scenari comportamentali valutati sul traffico locale producono allarmi ma
# non decisioni: un profilo privo del blocco `decisions` registra l'evento
# senza emettere un blocco.
#
# La ragione e' l'ampiezza dell'effetto, non la gravita' dell'evento. Una
# decisione ha ambito indirizzo, e un indirizzo pubblico e' condiviso da tutti
# gli utenti dietro lo stesso NAT: una singola postazione che attiva uno
# scenario renderebbe il servizio irraggiungibile per l'intera rete di
# provenienza. Vale anche per il traffico da rete cellulare, dove il CGNAT
# assegna lo stesso indirizzo a molti utenti.
#
# Le decisioni ricevute dalla Central API non passano da questi profili e
# restano applicate: riguardano host gia' segnalati come malevoli dalla rete
# CrowdSec, non indirizzi di provenienza del pubblico.
#
# Il contenimento dell'abuso e' realizzato a livello applicativo, con quote per
# sessione e limiti sulla creazione di sessioni.

name: local_alert_only
filters:
  - Alert.Remediation == true && Alert.GetScope() == "Ip"
on_success: break
