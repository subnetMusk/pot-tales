# Serve la SPA Phaser come sito statico, con fallback su index.html per il
# routing lato client.
#
# Le politiche di cache sono l'intervento con piu' effetto sul carico reale: le
# stesse postazioni ricaricano gli stessi asset molte volte in una giornata di
# apertura al pubblico. Senza istruzioni di cache ogni ricarica ripaga l'intero
# trasferimento, e il collo di bottiglia diventa la banda della sala.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Non dichiarare versione e prodotto nelle risposte e nelle pagine d'errore.
    server_tokens off;

    # --- Compressione ------------------------------------------------------
    # Solo su cio' che ne beneficia. Immagini e audio sono gia' compressi:
    # ricomprimerli consuma CPU e non riduce nulla.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf;

    # Serve la variante precompressa se il processo di build l'ha prodotta,
    # evitando di comprimere a ogni richiesta.
    gzip_static on;

    # --- Verifica di salute ------------------------------------------------
    # Endpoint dedicato: piu' economico di servire index.html a ogni controllo,
    # e non compare nell'analisi del traffico applicativo.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- Artefatti con impronta nel nome -----------------------------------
    # Lo strumento di build inserisce un digest nel nome: il contenuto di un
    # dato nome non cambia mai. `immutable` dice al browser di non chiedere
    # nemmeno una convalida, quindi la ricarica non produce alcuna richiesta.
    # La regex va fra virgolette: senza, nginx interpreta le parentesi graffe
    # del quantificatore come delimitatori di blocco e rifiuta il file.
    location ~* "-[A-Za-z0-9_]{8,}\.(js|css)$" {
        # Solo `add_header`: `expires` emetterebbe una seconda intestazione
        # Cache-Control con un valore diverso, e due valori in disaccordo sono
        # peggio di nessuna istruzione.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --- Asset di gioco ----------------------------------------------------
    # Nomi stabili senza impronta: un aggiornamento riusa lo stesso nome, quindi
    # una cache perpetua impedirebbe la consegna della versione nuova. Un'ora e'
    # il compromesso fra il traffico risparmiato durante una sessione di gioco e
    # il ritardo massimo con cui una correzione raggiunge le postazioni.
    location ~* \.(png|jpe?g|gif|webp|avif|svg|mp3|ogg|wav|m4a|woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /static/ {
        try_files $uri =404;
    }

    # --- Documento di ingresso ---------------------------------------------
    # Non deve essere messo in cache: e' il file che indica quali artefatti
    # caricare, e servirne una copia vecchia significa servire l'applicazione
    # vecchia anche quando tutto il resto e' aggiornato.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
