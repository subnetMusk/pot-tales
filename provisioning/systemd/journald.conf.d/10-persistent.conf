# Journal persistente su disco.
#
# Con Storage=volatile, il default in assenza di /var/log/journal, il journal
# vive in /run e viene perso al riavvio. Persistente, resta leggibile dopo un
# riavvio e contiene gli eventi che il sistema registra prima di cadere:
# terminazioni per esaurimento memoria e panic del kernel.

[Journal]
Storage=persistent
Compress=yes

# Tetti espliciti: senza, il journal si dimensiona su una frazione del
# filesystem che lo ospita.
SystemMaxUse=2G
SystemMaxFileSize=200M
SystemMaxFiles=20
MaxRetentionSec=1month

# Scrittura sincrona piu' frequente del default: riduce la finestra di righe
# perse in caso di arresto non ordinato.
SyncIntervalSec=30s
