# Rotazione dell'access log di Traefik.
#
# Il file non passa dal driver di logging di Docker: quello governa lo stdout
# dei container, e infatti daemon.json lo limita a tre file da dieci megabyte.
# Questo invece e' un file su un volume, scritto da Traefik e letto da CrowdSec,
# e nessuno dei due lo tronca. Senza rotazione cresce finche' il filesystem non
# finisce, portandosi dietro tutto cio' che vive sullo stesso volume: gli indici,
# lo stato di gioco e la pagina di ingresso.
#
# Il percorso passa da un glob perche' il nome del volume porta il prefisso dello
# stack, `pi_traefik_logs` con il nome predefinito. La radice e' quella dichiarata
# in docker/daemon.json.
#
# Non sta in /etc/logrotate.d/ di proposito: li' verrebbe processato anche dal
# logrotate di sistema, che tiene uno stato proprio, e due processi che ruotano
# lo stesso file con due contatori diversi si ostacolano a vicenda. Lo esegue
# soltanto traefik-logrotate.timer.

/srv/docker/volumes/*_traefik_logs/_data/*.log {
    # Il timer gira ogni ora, quindi il tetto e' il criterio che conta davvero:
    # un evento aperto al pubblico puo' produrre centinaia di megabyte in un
    # giorno, e una rotazione solo giornaliera lascerebbe crescere il file per
    # ventiquattro ore prima di intervenire.
    hourly
    maxsize 200M

    # Sette rotazioni compresse: abbastanza da coprire la finestra in cui si
    # indaga un incidente, poco abbastanza da restare sotto il gigabyte.
    rotate 7
    compress

    missingok
    notifempty

    # copytruncate e non un segnale al processo: Traefik riapre il file su
    # SIGUSR1, ma il processo vive in un container schedulato dall'orchestratore
    # e mandargli un segnale richiede prima di trovarlo, cosa che dallo spazio
    # dell'host non e' stabile fra un aggiornamento e l'altro. Il tailer di
    # CrowdSec riconosce il troncamento e riparte dall'inizio del file: la sola
    # finestra scoperta e' quella fra la copia e il troncamento.
    copytruncate
}
