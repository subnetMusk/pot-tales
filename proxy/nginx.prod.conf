worker_processes 1;

events {
    worker_connections 1024;
}

http {
    sendfile        on;
    tcp_nopush      on;
    include         /etc/nginx/mime.types;
    default_type    application/octet-stream;

    access_log      /var/log/nginx/access.log;
    error_log       /var/log/nginx/error.log warn;

    upstream server {
        server server:3000;
    }

    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  your.domain.com;

        # ===== STATIC frontend =====
        location / {
            root /var/www/frontend;
            index index.html;
            try_files $uri /index.html;
        }

        # ===== API PROXY =====

        location = /api/health {
            proxy_pass http://server/api/health;
            include /etc/nginx/proxy_params;
        }

        location = /auth/consent {
            proxy_pass http://server/auth/consent;
            include /etc/nginx/proxy_params;
        }

        location = /auth/validate {
            proxy_pass http://server/auth/validate;
            include /etc/nginx/proxy_params;
        }

        location = /auth/session {
            proxy_pass http://server/auth/session;
            include /etc/nginx/proxy_params;
        }

        location = /content/menu {
            proxy_pass http://server/content/menu;
            include /etc/nginx/proxy_params;
        }

        # fallback generico per tutte le API
        location /api/ {
            proxy_pass http://server;
            include /etc/nginx/proxy_params;
        }

        location /auth/ {
            proxy_pass http://server;
            include /etc/nginx/proxy_params;
        }

        location /content/ {
            proxy_pass http://server;
            include /etc/nginx/proxy_params;
        }
    }
}
