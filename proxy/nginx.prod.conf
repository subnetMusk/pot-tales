worker_processes 1;
events { worker_connections 1024; }

http {
    sendfile        on;
    tcp_nopush      on;
    include         /etc/nginx/mime.types;
    default_type    application/octet-stream;

    access_log      /var/log/nginx/access.log;
    error_log       /var/log/nginx/error.log warn;

    upstream server { server server:3000; }

    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  your.domain.com;

        # API health-check
        location = /api/health {
            proxy_pass          http://server/api/health;
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
        }

        # Consenso cookie
        location = /auth/consent {
            proxy_pass          http://server/auth/consent;
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
        }

        # Validazione sessione
        location = /auth/validate {
            proxy_pass          http://server/auth/validate;
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_set_header    Cookie             $http_cookie;
        }

        # Creazione sessione
        location = /auth/session {
            proxy_pass          http://server/auth/session;
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_set_header    Cookie             $http_cookie;
        }

        # Menu
        location = /content/menu {
            proxy_pass          http://server/content/menu;
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_set_header    Cookie             $http_cookie;
        }

        # Qualunque altra richiesta → Express servirà index.html o asset
        location / {
            proxy_pass          http://server;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_set_header   Cookie             $http_cookie;
        }
    }
}
