worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    upstream server {
        server server:3000;
    }

    server {
        listen 80 default_server;
        server_name _;

        # =========================
        # SANDBOX STATICI E ROUTING
        # =========================

        # Asset JS/CSS generati da Vite in client
        location /sandbox-assets/ {
            alias /var/www/sandbox/assets/;
            access_log off;
            types {
                application/javascript js;
                text/css css;
            }
            default_type application/javascript;
            try_files $uri =404;
        }

        # Asset statici del client (immagini, font, ecc.)
        location /client-assets/ {
            alias /var/www/client/assets/;
            access_log off;
            types {
                application/javascript js;
                text/css css;
                image/png png;
                image/jpeg jpeg;
            }

            try_files $uri =404;
        }

        # Asset statici del client (accesso da sandbox)
        location /sandbox/client-assets/ {
            alias /var/www/client/assets/;
            access_log off;
            types {
                application/javascript js;
                text/css css;
                image/png png;
                image/jpeg jpeg;
            }

            try_files $uri =404;
        }

        # Ingresso principale sandbox: serve dist/index.html
        location /sandbox/ {
            root /var/www;
            index index.html;
            try_files $uri /sandbox/index.html;
        }

        # =========================
        # CLIENT STATICI
        # =========================

        location /static/ {
            root /var/www/client;
        }

        location / {
            root /var/www/client;
            index index.html;
            try_files $uri /index.html;
        }

        # =========================
        # API (SERVER EXPRESS)
        # =========================

        location /api/ {
            proxy_pass http://server;
            include /etc/nginx/proxy_params;
        }

        location /auth/ {
            proxy_pass http://server;
            include /etc/nginx/proxy_params;
        }

        location /content/ {
            proxy_pass http://server;
            include /etc/nginx/proxy_params;
        }

        location /sandbox-api/ {
            proxy_pass http://server;
            include /etc/nginx/proxy_params;
        }
    }
}
