http {
    include       mime.types;
    default_type  application/octet-stream;

    upstream server {
        server server:3000;
    }

    server {
        listen 80 default_server;
        server_name _;

        access_log /var/log/nginx/access.log;
        error_log  /var/log/nginx/error.log warn;

        # ===== Client statici (non buildati) =====
        location /static/ {
            root /var/www/client;
        }

        location / {
            root /var/www/client;
            index index.html;
            try_files $uri /index.html;
        }

        # ===== Sandbox statici =====
        location /sandbox/static/ {
            root /var/www/sandbox;
        }

        location /sandbox/ {
            root /var/www/sandbox;
            index index.html;
            try_files $uri /index.html;
        }

        # ===== API proxying =====
        location /api/ {
            proxy_pass http://server;
            include /etc/nginx/proxy_params;
        }

        location /auth/ {
            proxy_pass http://server;
            include /etc/nginx/proxy_params;
        }

        location /content/ {
            proxy_pass http://server;
            include /etc/nginx/proxy_params;
        }

        location /sandbox-api/ {
            proxy_pass http://server;
            include /etc/nginx/proxy_params;
        }
    }
}
