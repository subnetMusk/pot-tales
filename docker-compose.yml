version: "3.9"

services:
  server:
    container_name: phaser-server
    build:
      context: .
      dockerfile: Dockerfile.server
    working_dir: /app/server
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./server:/app/server
    command: npm run dev
    depends_on:
      - mongodb

  sandbox-client:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    ports:
      - "5173:5173"
    volumes:
      - ./sandbox-client:/app
    working_dir: /app
    command: ["npx", "vite", "--host"]

  client:
    container_name: game-client
    build:
      context: .
      dockerfile: Dockerfile.client
    working_dir: /app/client
    ports:
      - "8080:80"
    depends_on:
      - server
      
  mongodb:
    image: mongo
    container_name: mongodb
    restart: unless-stopped
    env_file: .env
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: