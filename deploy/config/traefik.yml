# Traefik v3 — configurazione statica di produzione.
#
# Differenze rispetto alla configurazione di sviluppo, tutte deliberate:
#
#   - l'API di amministrazione non e' esposta. In sviluppo la porta 8080 serve
#     la dashboard senza autenticazione e **scavalca router e middleware**:
#     qualunque difesa dichiarata sui router non la riguarda
#   - nessun `serversTransport.insecureSkipVerify` globale. La verifica si
#     disattiva solo sul trasporto usato per l'endpoint di telemetria, che
#     presenta un certificato emesso dalla CA interna, ed e' dichiarato fra i
#     file dinamici

api:
  dashboard: false
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      # Il traffico in chiaro viene reindirizzato, non servito. Resta comunque
      # necessario tenere la porta aperta: e' il percorso su cui l'autorita' di
      # certificazione verifica il dominio.
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: principale

  # Entrypoint dedicato alla verifica di salute, non pubblicato dallo stack:
  # raggiungibile solo dall'interno del contenitore. Tenerlo separato da `web`
  # evita di esporre pubblicamente un endpoint che dichiara lo stato del proxy.
  ping:
    address: ":8082"

# L'immagine di Traefik non contiene una shell ne' un client HTTP: la verifica
# passa dal sottocomando `healthcheck`, che richiede questo endpoint attivo.
ping:
  entryPoint: ping

# Emissione automatica del certificato.
#
# Deve trattarsi di una CA pubblicamente attendibile: il pubblico arriva da
# telefono dopo la scansione di un codice QR, e un certificato emesso da una CA
# interna sarebbe un vicolo cieco senza modo di installarla.
#
# Se il dipartimento fornisce un certificato proprio, questa sezione resta
# inerte: basta dichiarare i file in `dynamic/tls.yml` e togliere `certResolver`
# dall'entrypoint. La decisione e' aperta, quindi la strada che non dipende da
# terzi e' quella predefinita.
certificatesResolvers:
  principale:
    acme:
      email: "${ACME_EMAIL}"
      storage: /acme/acme.json
      # Verifica sulla porta 80. Il router di verifica ha priorita' maggiore
      # del reindirizzamento dichiarato sull'entrypoint, quindi la richiesta di
      # controllo non viene deviata.
      httpChallenge:
        entryPoint: web

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO

# Access log su file in formato JSON: e' la sorgente che CrowdSec analizza per
# rilevare scansioni e tentativi ripetuti. Gli header sono scartati per
# impostazione predefinita, tranne User-Agent, su cui si basano alcuni scenari.
accessLog:
  filePath: /var/log/traefik/access.log
  format: json
  bufferingSize: 100
  fields:
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
