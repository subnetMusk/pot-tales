# Consegna in sola lettura degli archivi prodotti dall'esportazione.
#
# I dati raccolti durante l'esercizio esistono soltanto su questa macchina, che
# viene dismessa al termine del periodo: questo percorso e' il modo in cui
# escono. Serve cio' che l'unita' oneshot ha gia' scritto, e nient'altro.
#
# Tre proprieta' deliberate:
#
#   nessun elenco della directory  chi preleva conosce i nomi dal manifesto
#                                  dell'esportazione. Un elenco esporrebbe la
#                                  cadenza delle copie e i nomi degli indici a
#                                  chiunque superi il bordo
#
#   sola lettura                   il volume e' montato in sola lettura e i
#                                  metodi diversi da GET e HEAD sono rifiutati,
#                                  perche' un percorso raggiungibile
#                                  dall'esterno non deve poter diventare una
#                                  via di scrittura sulla macchina
#
#   nessuna produzione di archivi  qui non esiste alcun percorso che avvii
#                                  un'esportazione. L'esportazione e'
#                                  deliberatamente lenta per non disturbare il
#                                  gioco: renderla avviabile dall'esterno
#                                  significherebbe consegnare una leva di
#                                  degrado a chiunque conosca l'indirizzo

server {
    listen 80;
    server_name _;

    # Il bordo autentica e rimuove il prefisso: qui i percorsi sono gia'
    # relativi alla radice degli archivi.
    root /srv/export;

    autoindex off;
    server_tokens off;

    # La verifica di salute non deve dipendere dalla presenza di archivi: la
    # directory resta vuota fino alla prima esportazione, e un healthcheck che
    # interrogasse la radice terrebbe il servizio perennemente non sano.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        limit_except GET HEAD {
            deny all;
        }

        # Gli archivi sono gia' compressi con gzip: ricomprimerli consuma CPU
        # durante un prelievo e non riduce nulla.
        gzip off;

        # I file NDJSON e gli archivi nativi vanno salvati, non interpretati dal
        # browser: senza questa intestazione un manifesto verrebbe mostrato e
        # un archivio potrebbe essere aperto da un plugin.
        add_header Content-Disposition "attachment";

        # Nessun ripiego su un indice: un percorso inesistente e' 404, non
        # l'inizio di una risoluzione che potrebbe rivelare la struttura.
        try_files $uri =404;
    }
}
