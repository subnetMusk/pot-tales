# Configurazione di Filebeat, distribuita come Swarm `config`.
#
# Non include `setup.kibana`: l'avvio non dipende dalla disponibilita' di
# Kibana. Filebeat dispone di retry nativi verso Elasticsearch e si riconnette
# autonomamente quando il nodo diventa disponibile.

filebeat.inputs:
  - type: container
    paths:
      - /var/lib/docker/containers/*/*.log
    processors:
      - add_docker_metadata:
          # Attraverso il filtro, non sul socket. Montare il socket in un
          # contenitore equivale a concedergli il controllo della macchina.
          host: "tcp://socket-proxy:2375"
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: true
          process_array: false
          max_depth: 1

output.elasticsearch:
  hosts: ["https://es01:9200"]
  username: "${ELASTICSEARCH_USERNAME}"
  password: "${ELASTICSEARCH_PASSWORD}"
  ssl.certificate_authorities: ["/usr/share/filebeat/certs/ca/ca.crt"]

# Il data stream standalone `filebeat-*` non compone `logs@custom`: la replica
# va quindi impostata nel template che Filebeat installa prima dell'ingestione.
setup.template.settings:
  index.number_of_replicas: 0

logging.json: true
logging.metrics.enabled: false
