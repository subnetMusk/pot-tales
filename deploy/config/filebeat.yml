# Configurazione di Filebeat, distribuita come Swarm `config`.
#
# Non include `setup.kibana`: l'avvio non dipende dalla disponibilita' di
# Kibana. Filebeat dispone di retry nativi verso Elasticsearch e si riconnette
# autonomamente quando il nodo diventa disponibile.

filebeat.inputs:
  - type: container
    paths:
      - /var/lib/docker/containers/*/*.log
    processors:
      - add_docker_metadata:
          # Attraverso il filtro, non sul socket. Montare il socket in un
          # contenitore equivale a concedergli il controllo della macchina.
          host: "tcp://socket-proxy:2375"
      # Filebeat non deve reingerire i propri warning. Oltre al rumore, un
      # errore di indicizzazione genererebbe un nuovo log da indicizzare e
      # alimenterebbe da solo il problema che stiamo cercando di osservare.
      - drop_event:
          when:
            regexp:
              container.name: '^/?[^.]+_filebeat\.'
      # I log tecnici restano interrogabili senza espandere alla radice il JSON
      # arbitrario prodotto da ogni immagine. Campi omonimi con tipi diversi
      # sono una causa comune di mapping conflict e di eventi scartati.
      - add_fields:
          target: event
          fields:
            dataset: container.log
      # Solo il backend emette il contratto JSON/ECS controllato dal progetto.
      # `expand_keys` trasforma chiavi come `event.dataset` e `partita.id` nei
      # rispettivi oggetti, prima del routing verso il data stream di partita.
      - decode_json_fields:
          when:
            regexp:
              container.name: '^/?[^.]+_server\.'
          fields: ["message"]
          target: ""
          overwrite_keys: true
          expand_keys: true
          add_error_key: true
          process_array: false
          max_depth: 1

  # Access log del bordo. Il file locale completo resta la sorgente di
  # CrowdSec; la copia spedita a Elasticsearch non conserva indirizzi o
  # credenziali HTTP, che non servono alle dashboard.
  - type: filestream
    id: traefik-access
    paths:
      - /var/log/traefik/access.log
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true
    processors:
      - add_fields:
          target: event
          fields:
            dataset: traefik.access
      - drop_fields:
          fields:
            - "ClientHost"
            - "ClientAddr"
            - "request_Authorization"
            - "request_Cookie"
          ignore_missing: true

output.elasticsearch:
  hosts: ["https://es01:9200"]
  username: "${ELASTICSEARCH_USERNAME}"
  password: "${ELASTICSEARCH_PASSWORD}"
  ssl.certificate_authorities: ["/usr/share/filebeat/certs/ca/ca.crt"]

  # I fatti di partita vanno su un data stream dedicato, separato da quello
  # tecnico.
  #
  # Non e' una preferenza di ordine: con licenza basic la sicurezza a livello
  # di documento non esiste, quindi non c'e' modo di concedere alla platea
  # divulgativa un sottoinsieme di documenti dentro `filebeat-*`. O legge tutti
  # i log di sistema, o non legge nulla. La separazione in indici distinti e'
  # l'unico meccanismo disponibile per delimitare cio' che viene condiviso.
  #
  # Il nome segue lo schema `logs-<dataset>-<namespace>`, che il template
  # predefinito di Elasticsearch riconosce creando il data stream alla prima
  # scrittura. Le voci che non corrispondono alla condizione mantengono la
  # destinazione predefinita.
  indices:
    - index: "logs-gioco.partita-default"
      when.equals:
        event.dataset: "gioco.partita"

# Il data stream standalone `filebeat-*` non compone `logs@custom`: la replica
# va quindi impostata nel template che Filebeat installa prima dell'ingestione.
setup.template.settings:
  index.number_of_replicas: 0

logging.json: true
logging.metrics.enabled: false
# Gli eventi rifiutati contengono il documento e il motivo preciso. Tenerli in
# un file separato rende diagnosticabile uno scarto senza alzare il livello di
# log generale e senza stampare dati applicativi su stdout.
logging.event_data:
  to_files: true
  files:
    path: /usr/share/filebeat/logs/event-data
    name: filebeat-events-data
    keepfiles: 4
    permissions: 0600
