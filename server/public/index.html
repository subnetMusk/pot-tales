<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phaser Game</title>
</head>
<body>
  <div id="app"></div>

  <script>
    (async () => {
      const appEl = document.getElementById('app');
      if (!appEl) return;
      try {
        // 1) Verifica sessione
        const validateResp = await fetch('/auth/validate', {
          method: 'GET',
          credentials: 'include'
        });
        // 2) Seleziona pagina
        const pageUrl = validateResp.ok ? '/content/menu' : '/auth/consent';
        // 3) Fetch e iniezione
        const pageResp = await fetch(pageUrl, {
          method: 'GET',
          credentials: 'include'
        });
        if (!pageResp.ok) throw new Error(`Errore ${pageResp.status}`);
        const htmlText = await pageResp.text();
        const parsed = new DOMParser().parseFromString(htmlText, 'text/html');
        appEl.innerHTML = parsed.body.innerHTML;
      } catch (err) {
        console.error('Errore bootstrap client:', err);
        appEl.innerHTML = `<div style="color:red; padding:20px;"><h2>Errore</h2><pre>${err.message}</pre></div>`;
      }
    })();
  </script>
</body>
</html>
