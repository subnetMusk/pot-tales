<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Dev Dashboard</title>
</head>
<body>
  <h1>Sandbox Dashboard</h1>
  <form id="sceneForm">
    <label for="objects">JSON oggetti:</label><br>
    <textarea id="objects" rows="6" cols="50">
[{"type":"enemy","x":100,"y":100},{"type":"player","x":50,"y":200}]
    </textarea><br>
    <button type="submit">Genera scena</button>
  </form>

  <script>
    document.getElementById('sceneForm').addEventListener('submit', async e => {
      e.preventDefault();
      let objects;
      try {
        objects = JSON.parse(document.getElementById('objects').value);
      } catch {
        return alert('JSON non valido');
      }
      const res = await fetch('/sandbox/customscene', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({objects})
      });
      if (!res.ok) return alert('Errore creazione scena');
      const { sceneId } = await res.json();
      // Redirect al client “wrapper” con sceneId in query
      window.location.href = `/?sceneId=${sceneId}`;
    });
  </script>
</body>
</html>
