# Pagina di ingresso statica.
#
# Volutamente priva di dipendenze: nessuna chiamata al backend, nessun asset
# esterno, nessun riferimento a servizi che possono essere fermi. E' il punto
# comunicato ai visitatori, quindi deve rispondere anche quando il resto e'
# degradato, ed e' l'unico modo di dirglielo.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_min_length 512;
    gzip_types text/html text/css application/javascript;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Cache breve: il contenuto puo' cambiare fra un evento e l'altro, e la
    # pagina e' abbastanza piccola perche' rileggerla non costi nulla.
    location / {
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri/ /index.html;
    }
}
